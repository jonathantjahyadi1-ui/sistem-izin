<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Poppins Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }
        :root {
            --primary: #5b86e5;
            --secondary: #36d1dc;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1f2937;
            --light: #f9fafb;
            --gray: #6b7280;
        }

        body { 
            background: linear-gradient(135deg, #5b86e5 0%, #36d1dc 100%);
            min-height: 100vh;
        }
        .card {
            border-radius: 14px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 2px solid #e5e7eb;
            padding: 10px 14px;
            font-size: 0.95rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91, 134, 229, 0.1);
        }
        .btn-success {
            background: var(--success);
            border: none;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .strength-bar {
            width: 100%;
            height: 6px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <form method="POST" class="card p-4 shadow fade-in" style="width: 360px;" id="formRegister">
        
        <h4 class="text-center mb-4 fw-bold">
            <i class="bi bi-person-plus"></i> Register
        </h4>
<!-- FLASH MESSAGE -->
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
    <div class="alert alert-{{ category }} py-2 alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
{% endfor %}
{% endwith %}

        <!-- NAMA LENGKAP -->
<div class="mb-3">
    <label class="form-label fw-600">Nama Lengkap</label>
    <input name="username"
           id="username"
           class="form-control"
           placeholder="Contoh: Budi Santoso"
           required>
    <small class="text-muted">
        Wajib menggunakan nama lengkap sesuai data karyawan, minimal 2 kata.
    </small>
</div>

        <!-- PASSWORD -->
        <div class="mb-3">
            <label class="form-label fw-600">Password</label>
            <div class="input-group">
                <input type="password" name="password" id="password" class="form-control" required>
                <button type="button" class="btn btn-outline-secondary" id="togglePass">
                    <i class="bi bi-eye"></i>
                </button>
            </div>

            <!-- strength -->
            <div class="strength-bar mt-2">
                <div id="strengthFill" class="strength-fill bg-danger"></div>
            </div>
            <small id="strengthText" class="text-muted"></small>
        </div>

        <!-- CONFIRM -->
        <div class="mb-3">
            <label class="form-label fw-600">Konfirmasi Password</label>
            <input type="password" id="confirmPassword" class="form-control" required>
            <small id="matchText"></small>
        </div>

        <!-- DIVISI -->
        <div class="mb-4">
            <label class="form-label fw-600">Divisi</label>
            <select name="divisi" class="form-control" required>
                <option value="">-- Pilih Divisi --</option>
                <option>Marketing</option>
                <option>Operational</option>
                <option>Hostlive</option>
                <option>Creative</option>
                <option>Accounting</option>
                <option>IT Support</option>
                <option>HRD</option>
            </select>
        </div>

        <!-- BUTTON -->
        <button class="btn btn-success w-100 shadow-sm" id="btnSubmit">
            <i class="bi bi-check-circle"></i> Register
        </button>

        <!-- LINK -->
        <a href="/login" class="text-center mt-3 d-block text-decoration-none">
            Sudah punya akun? <strong>Login</strong>
        </a>

    </form>

</div>

<script>
const pass = document.getElementById("password");
const username = document.getElementById("username");
const confirmPass = document.getElementById("confirmPassword");
const matchText = document.getElementById("matchText");
const strengthFill = document.getElementById("strengthFill");
const strengthText = document.getElementById("strengthText");
const toggle = document.getElementById("togglePass");
const form = document.getElementById("formRegister");

toggle.addEventListener("click", () => {
    pass.type = pass.type === "password" ? "text" : "password";
});

pass.addEventListener("input", () => {
    const val = pass.value;
    let score = 0;

    if (val.length >= 6) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const widths = ["25%", "50%", "75%", "100%"];
    const colors = ["bg-danger", "bg-warning", "bg-info", "bg-success"];
    const texts = ["Lemah", "Lumayan", "Kuat", "Sangat Kuat"];

    if (score > 0) {
        strengthFill.style.width = widths[score-1];
        strengthFill.className = "strength-fill " + colors[score-1];
        strengthText.innerText = texts[score-1];
    } else {
        strengthFill.style.width = "0%";
        strengthText.innerText = "";
    }
});

confirmPass.addEventListener("input", () => {
    if (confirmPass.value !== pass.value) {
        matchText.innerText = "Password tidak sama";
        matchText.className = "text-danger";
    } else {
        matchText.innerText = "Password cocok";
        matchText.className = "text-success";
    }
});

form.addEventListener("submit", (e) => {
    const fullName = username.value.trim().replace(/\s+/g, " ");

    if (fullName.split(" ").length < 2) {
        e.preventDefault();
        alert("Nama wajib menggunakan nama lengkap minimal 2 kata.");
        return;
    }

    username.value = fullName;

    if (confirmPass.value !== pass.value) {
        e.preventDefault();
        alert("Password tidak sama!");
        return;
    }

    document.getElementById("btnSubmit").innerText = "Loading...";
});
</script>

</body>
</html>
