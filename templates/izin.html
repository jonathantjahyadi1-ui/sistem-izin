<!DOCTYPE html>
<html>
<head>
    <title>Ajukan Izin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { background: #f4f6f9; }
        .card { border-radius: 12px; }
        .required:after {
            content: " *";
            color: red;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">Sistem Izin</span>
    <a href="/dashboard" class="btn btn-sm btn-light">← Kembali</a>
</nav>

<div class="container mt-5">
    <div class="card shadow-lg border-0 p-4">
        <h3 class="mb-4 text-center"><i class="bi bi-calendar-plus"></i> Ajukan Izin</h3>

        <form action="/izin" method="POST" enctype="multipart/form-data" id="izinForm">
            <!-- JENIS IZIN -->
            <div class="mb-3">
                <label class="form-label required">Jenis Izin</label>
                <select name="jenis" id="jenis" class="form-control" required>
                    <option value="">-- Pilih --</option>
                    <option value="cuti">Cuti</option>
                    <option value="sakit">Sakit</option>
                    <option value="izin_lain">Izin</option>
                </select>
            </div>

            <!-- TANGGAL -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Tanggal Mulai</label>
                    <input type="date" name="mulai" id="mulai" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Tanggal Selesai</label>
                    <input type="date" name="selesai" id="selesai" class="form-control" required>
                </div>
            </div>

            <!-- DURASI -->
            <div class="mb-3">
                <label class="form-label">Durasi (hari)</label>
                <input type="text" id="durasi" class="form-control" readonly>
            </div>

            <!-- ALERT WAJIB SURAT DOKTER (khusus sakit >1 hari) -->
            <div class="alert alert-warning d-none" id="warningSurat">
                ⚠️ Jika sakit lebih dari 1 hari, wajib upload surat dokter!
            </div>

            <!-- ALERT WAJIB BUKTI CHAT (untuk semua jenis izin) -->
            <div class="alert alert-info" id="warningChat">
                📌 Wajib upload bukti chat (screenshot izin ke User/Leader) untuk semua jenis izin.
            </div>

            <!-- ALASAN -->
            <div class="mb-3">
                <label class="form-label">Alasan</label>
                <textarea name="alasan" class="form-control" rows="3" required></textarea>
            </div>

            <!-- FILE SURAT (khusus sakit) -->
            <div class="mb-3" id="suratGroup">
                <label class="form-label">Upload Surat (jika ada)</label>
                <input type="file" name="file" id="file" class="form-control">
                <small class="text-muted">Format: PDF/JPG/PNG (khusus sakit >1 hari wajib)</small>
            </div>

            <!-- FILE BUKTI CHAT (WAJIB UNTUK SEMUA) -->
            <div class="mb-3">
                <label class="form-label required">Upload Bukti Chat (User/Leader)</label>
                <input type="file" name="file_chat" id="file_chat" class="form-control" required>
                <small class="text-muted">Upload screenshot chat izin Anda (wajib untuk semua pengajuan)</small>
            </div>

            <!-- PREVIEW -->
            <div id="preview" class="mb-3"></div>

            <!-- BUTTON -->
            <button class="btn btn-primary w-100" id="submitBtn">Submit Izin</button>
        </form>
    </div>
</div>

<script>
    const mulai = document.getElementById("mulai");
    const selesai = document.getElementById("selesai");
    const durasi = document.getElementById("durasi");
    const jenis = document.getElementById("jenis");
    const warningSurat = document.getElementById("warningSurat");
    const fileSurat = document.getElementById("file");
    const fileChat = document.getElementById("file_chat");
    const form = document.getElementById("izinForm");
    const submitBtn = document.getElementById("submitBtn");

    function hitungDurasi() {
        if (mulai.value && selesai.value) {
            const t1 = new Date(mulai.value);
            const t2 = new Date(selesai.value);
            const diff = (t2 - t1) / (1000 * 60 * 60 * 24) + 1;
            durasi.value = diff > 0 ? diff : 0;

            // Validasi surat dokter: hanya untuk sakit dan durasi > 1
            if (jenis.value === "sakit" && diff > 1) {
                warningSurat.classList.remove("d-none");
                fileSurat.setAttribute("required", "required");
            } else {
                warningSurat.classList.add("d-none");
                fileSurat.removeAttribute("required");
            }
        }
    }

    mulai.addEventListener("change", hitungDurasi);
    selesai.addEventListener("change", hitungDurasi);
    jenis.addEventListener("change", hitungDurasi);

    // Validasi sebelum submit: cek file chat wajib diisi
    form.addEventListener("submit", function(e) {
        if (!fileChat.files.length) {
            e.preventDefault();
            alert("❌ Bukti chat wajib diupload! Silakan upload screenshot izin ke User/Leader.");
            return false;
        }
        // Jika sakit dan durasi >1, cek file surat juga
        if (jenis.value === "sakit") {
            const diff = durasi.value;
            if (diff > 1 && !fileSurat.files.length) {
                e.preventDefault();
                alert("❌ Untuk sakit lebih dari 1 hari, wajib upload surat dokter!");
                return false;
            }
        }
        submitBtn.disabled = true;
        submitBtn.innerText = "Memproses...";
    });

    // Preview file chat (opsional)
    fileChat.addEventListener("change", function() {
        const file = this.files[0];
        const preview = document.getElementById("preview");
        if (file) {
            preview.innerHTML = `<div class="alert alert-success">✅ Bukti chat: ${file.name} siap diupload</div>`;
        } else {
            preview.innerHTML = `<div class="alert alert-danger">⚠️ Bukti chat belum dipilih</div>`;
        }
    });
</script>
</body>
</html>
