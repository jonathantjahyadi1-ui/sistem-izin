<!DOCTYPE html>
<html>
<head>
    <title>Ajukan Izin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #5b86e5 0%, #36d1dc 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
        }
        
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .card-header {
            background: linear-gradient(135deg, #5b86e5 0%, #36d1dc 100%);
            color: white;
            border: none;
            padding: 30px;
            text-align: center;
        }
        
        .card-header h3 {
            margin: 0;
            font-weight: 700;
            font-size: 1.8rem;
        }
        
        .card-body {
            padding: 30px;
        }
        
        .form-label {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        
        .form-control, .form-select {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #5b86e5;
            box-shadow: 0 0 0 3px rgba(91, 134, 229, 0.1);
        }
        
        .input-group .form-control {
            border-right: none;
        }
        
        .input-group .input-group-text {
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
            color: #6b7280;
        }
        
        .required:after {
            content: " *";
            color: #ef4444;
        }
        
        .alert {
            border: none;
            border-radius: 8px;
            border-left: 4px solid;
        }
        
        .alert-warning {
            border-left-color: #f59e0b;
            background: #fffbeb;
            color: #92400e;
        }
        
        .alert-info {
            border-left-color: #5b86e5;
            background: #eff6ff;
            color: #1e40af;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #5b86e5 0%, #36d1dc 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s ease;
            width: 100%;
        }
        
        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(91, 134, 229, 0.3);
        }
        
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        @media (max-width: 576px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .card-body {
                padding: 20px;
            }
        }
        
        .file-input-wrapper {
            position: relative;
        }
        
        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            background: #f9fafb;
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .file-input-label:hover {
            background: #f3f4f6;
            border-color: #5b86e5;
        }
        
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="card">
        <div class="card-header">
            <h3><i class="bi bi-calendar-plus"></i> Ajukan Izin</h3>
        </div>
        
        <div class="card-body">
            <form action="/izin" method="POST" enctype="multipart/form-data" id="izinForm">
                
                <!-- JENIS IZIN -->
                <div class="mb-4">
                    <label class="form-label required">Jenis Izin</label>
                    <select name="jenis" id="jenis" class="form-select" required>
                        <option value="">-- Pilih Jenis Izin --</option>
                        <option value="cuti">🏖️ Cuti</option>
                        <option value="sakit">🏥 Sakit</option>
                        <option value="izin_lain">📝 Izin Lainnya</option>
                    </select>
                </div>

                <!-- TANGGAL -->
                <div class="form-row mb-4">
                    <div>
                        <label class="form-label required">Tanggal Mulai</label>
                        <input type="date" name="mulai" id="mulai" class="form-control" required>
                    </div>
                    <div>
                        <label class="form-label required">Tanggal Selesai</label>
                        <input type="date" name="selesai" id="selesai" class="form-control" required>
                    </div>
                </div>

                <!-- DURASI -->
                <div class="mb-4">
                    <label class="form-label">Durasi</label>
                    <div class="input-group">
                        <input type="text" id="durasi" class="form-control" readonly>
                        <span class="input-group-text"><i class="bi bi-calendar-day"></i> Hari</span>
                    </div>
                </div>

                <!-- ALERT SURAT DOKTER -->
                <div class="alert alert-warning d-none" id="warningSurat">
                    <i class="bi bi-exclamation-triangle"></i> <strong>Perhatian!</strong> Untuk sakit lebih dari 1 hari, wajib upload surat dokter.
                </div>

                <!-- ALERT BUKTI CHAT -->
                <div class="alert alert-info mb-4" id="warningChat">
                    <i class="bi bi-info-circle"></i> <strong>Info:</strong> Bukti chat dengan User/Leader wajib diupload untuk semua pengajuan.
                </div>

                <!-- ALASAN -->
                <div class="mb-4">
                    <label class="form-label required">Alasan</label>
                    <textarea name="alasan" class="form-control" rows="4" placeholder="Jelaskan alasan izin Anda..." required></textarea>
                </div>

                <!-- FILE SURAT DOKTER -->
                <div class="mb-4" id="suratGroup">
                    <label class="form-label">Upload Surat Dokter <span style="color: #ef4444; display: none;" id="suratRequired">(Wajib untuk sakit >1 hari)</span></label>
                    <div class="file-input-wrapper">
                        <label class="file-input-label" for="file">
                            <i class="bi bi-cloud-arrow-up"></i>
                            <span>Klik untuk upload atau drag file di sini</span>
                        </label>
                        <input type="file" id="file" name="file" accept=".pdf,.jpg,.jpeg,.png">
                        <small class="text-muted d-block mt-2">Format: PDF, JPG, PNG (Max 5MB)</small>
                        <div id="filePreview"></div>
                    </div>
                </div>

                <!-- FILE BUKTI CHAT -->
                <div class="mb-4">
                    <label class="form-label required">Upload Bukti Chat (Screenshot)</label>
                    <div class="file-input-wrapper">
                        <label class="file-input-label" for="file_chat">
                            <i class="bi bi-image"></i>
                            <span>Klik untuk upload screenshot izin Anda</span>
                        </label>
                        <input type="file" id="file_chat" name="file_chat" accept="image/*" required>
                        <small class="text-muted d-block mt-2">Format: JPG, PNG (Max 5MB)</small>
                        <div id="chatPreview"></div>
                    </div>
                </div>

                <!-- BUTTON -->
                <button type="submit" class="btn btn-submit" id="submitBtn">
                    <i class="bi bi-check-circle"></i> Ajukan Izin
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    const mulai = document.getElementById("mulai");
    const selesai = document.getElementById("selesai");
    const durasi = document.getElementById("durasi");
    const jenis = document.getElementById("jenis");
    const warningSurat = document.getElementById("warningSurat");
    const suratRequired = document.getElementById("suratRequired");
    const fileSurat = document.getElementById("file");
    const fileChat = document.getElementById("file_chat");
    const form = document.getElementById("izinForm");
    const submitBtn = document.getElementById("submitBtn");
    const filePreview = document.getElementById("filePreview");
    const chatPreview = document.getElementById("chatPreview");

    function hitungDurasi() {
        if (mulai.value && selesai.value) {
            const t1 = new Date(mulai.value);
            const t2 = new Date(selesai.value);
            const diff = (t2 - t1) / (1000 * 60 * 60 * 24) + 1;
            durasi.value = diff > 0 ? diff : 0;

            if (jenis.value === "sakit" && diff > 1) {
                warningSurat.classList.remove("d-none");
                suratRequired.style.display = "inline";
                fileSurat.setAttribute("required", "required");
            } else {
                warningSurat.classList.add("d-none");
                suratRequired.style.display = "none";
                fileSurat.removeAttribute("required");
            }
        }
    }

    mulai.addEventListener("change", hitungDurasi);
    selesai.addEventListener("change", hitungDurasi);
    jenis.addEventListener("change", hitungDurasi);

    // File preview
    fileSurat.addEventListener("change", function() {
        if (this.files.length > 0) {
            filePreview.innerHTML = `<div class="alert alert-success mt-2">✅ File: <strong>${this.files[0].name}</strong></div>`;
        } else {
            filePreview.innerHTML = "";
        }
    });

    fileChat.addEventListener("change", function() {
        if (this.files.length > 0) {
            chatPreview.innerHTML = `<div class="alert alert-success mt-2">✅ Screenshot: <strong>${this.files[0].name}</strong></div>`;
        } else {
            chatPreview.innerHTML = "";
        }
    });

    form.addEventListener("submit", function(e) {
        if (!fileChat.files.length) {
            e.preventDefault();
            alert("❌ Bukti chat wajib diupload!");
            return false;
        }
        
        if (jenis.value === "sakit") {
            const diff = durasi.value;
            if (diff > 1 && !fileSurat.files.length) {
                e.preventDefault();
                alert("❌ Untuk sakit > 1 hari, surat dokter wajib diupload!");
                return false;
            }
        }
        
        submitBtn.disabled = true;
        submitBtn.innerText = "⏳ Memproses...";
    });
</script>

</body>
</html>
