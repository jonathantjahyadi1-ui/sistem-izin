<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Poppins Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }
        :root {
            --primary: #5b86e5;
            --secondary: #36d1dc;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1f2937;
            --light: #f9fafb;
            --gray: #6b7280;
        }
        
        body { 
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            min-height: 100vh;
        }
        .card { 
            border-radius: 14px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 2px solid #e5e7eb;
            padding: 10px 14px;
            font-size: 0.95rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91, 134, 229, 0.1);
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background: #4a6ec2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(91, 134, 229, 0.3);
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <form method="POST" class="card p-4 shadow" style="width: 360px;" id="loginForm">
        
        <h4 class="text-center mb-4 fw-bold">🔐 Login</h4>

        <!-- 🔔 FLASH MESSAGE -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{category}} py-2 alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
        {% endwith %}

        <!-- USERNAME -->
        <div class="mb-3">
            <label class="form-label fw-600">Username</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="username" id="username" class="form-control" required>
            </div>
        </div>

        <!-- PASSWORD -->
        <div class="mb-3">
            <label class="form-label fw-600">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" id="password" class="form-control" required>
                <button type="button" class="btn btn-outline-secondary" id="togglePass">👁</button>
            </div>
        </div>

        <!-- REMEMBER -->
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label" for="remember">
                Remember me
            </label>
        </div>

        <!-- BUTTON -->
        <button class="btn btn-primary w-100" id="btnLogin">
            Login
        </button>

        <!-- LINK REGISTER -->
        <a href="/register" class="text-center mt-3 d-block text-decoration-none">
            Belum punya akun? <strong>Register</strong>
        </a>

    </form>

</div>

<!-- SCRIPT -->
<script>
    const toggle = document.getElementById("togglePass");
    const pass = document.getElementById("password");
    const form = document.getElementById("loginForm");
    const btn = document.getElementById("btnLogin");

    toggle.addEventListener("click", () => {
        pass.type = pass.type === "password" ? "text" : "password";
    });

    form.addEventListener("submit", () => {
        btn.innerText = "Loading...";
        btn.disabled = true;
    });
</script>

</body>
</html>
