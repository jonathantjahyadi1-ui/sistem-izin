<!DOCTYPE html>
<html>
<head>
    <title>Pilih Sistem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { 
            background: linear-gradient(135deg, #5b86e5 0%, #36d1dc 100%);
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .card-pilih { 
            border-radius: 20px; 
            border: none; 
            transition: transform 0.3s, box-shadow 0.3s; 
            cursor: pointer;
            background: white;
        }
        .card-pilih:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
        }
    </style>
</head>
<body>
<div class="container text-center">
    <h2 class="text-white mb-5">Halo, {{ user.username }}! Mau akses apa hari ini?</h2>
    <div class="row justify-content-center g-4">
    <div class="col-md-4">
        <a href="{{ url_for('main_dashboard', system='izin') }}" class="text-decoration-none">
            <div class="card card-pilih p-5 h-100">
                <h1>🕒</h1>
                <h3>Izin & Kehadiran</h3>
                <p class="text-muted">Kelola cuti, sakit, izin, dan rekap kehadiran</p>
            </div>
        </a>
    </div>

    <div class="col-md-4">
        <a href="{{ url_for('main_dashboard', system='reimburse') }}" class="text-decoration-none">
            <div class="card card-pilih p-5 h-100">
                <h1>💰</h1>
                <h3>Reimburse</h3>
                <p class="text-muted">Klaim nota, upload bukti, dan lihat status</p>
            </div>
        </a>
    </div>

    <div class="col-md-4">
        <a href="{{ url_for('main_dashboard', system='purchase_order') }}" class="text-decoration-none">
            <div class="card card-pilih p-5 h-100">
                <h1>📦</h1>
                <h3>Purchase Order</h3>
                <p class="text-muted">Ajukan pembelian barang sebelum barang dipesan perusahaan</p>
            </div>
        </a>
    </div>
</div>

    <br>
    <a href="/logout" class="btn btn-light mt-4">Logout</a>
</div>
</body>
</html>
