<!DOCTYPE html>
<html>
<head>
    <title>Pilih Sistem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { 
            font-family: 'Poppins', sans-serif; 
        }

        body { 
            background: linear-gradient(135deg, #5b86e5 0%, #36d1dc 100%);
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .card-pilih { 
            border-radius: 20px; 
            border: none; 
            transition: transform 0.3s, box-shadow 0.3s; 
            cursor: pointer;
            background: white;
        }

        .card-pilih:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
        }

        .system-title {
            font-weight: 600;
        }

        .system-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

<div class="container text-center">
    <h2 class="text-white mb-5">
        Halo, {{ user.username }}! Mau akses apa hari ini?
    </h2>

    <div class="row justify-content-center g-4">

        <!-- Izin -->
        <div class="col-md-4">
            <a href="{{ url_for('main_dashboard', system='izin') }}" class="text-decoration-none">
                <div class="card card-pilih p-5 h-100">
                    <div class="system-icon">🕒</div>
                    <h3 class="system-title">Izin & Kehadiran</h3>
                    <p class="text-muted">
                        Kelola cuti, sakit, izin, dan rekap kehadiran
                    </p>
                </div>
            </a>
        </div>

        <!-- Lembur -->
        <div class="col-md-4">
            <a href="{{ url_for('main_dashboard', system='overtime') }}" class="text-decoration-none">
                <div class="card card-pilih p-5 h-100">
                    <div class="system-icon">⏱️</div>
                    <h3 class="system-title">Lembur</h3>
                    <p class="text-muted">
                        Ajukan lembur, upload bukti, dan approval HRD
                    </p>
                </div>
            </a>
        </div>

        <!-- Booking Ruang Meeting -->
        <div class="col-md-4">
            <a href="{{ url_for('main_dashboard', system='meeting_room') }}" class="text-decoration-none">
                <div class="card card-pilih p-5 h-100">
                    <div class="system-icon">🏢</div>
                    <h3 class="system-title">Booking Ruang Meeting</h3>
                    <p class="text-muted">
                        Ajukan pemakaian ruang meeting dan tunggu approval HRD
                    </p>
                </div>
            </a>
        </div>

    </div>

    <br>
    <a href="/logout" class="btn btn-light mt-4">Logout</a>
</div>

</body>
</html>
